{% extends "base.html" %}

{% block title %}Создать кейс - Админ-панель Перетяжкофф{% endblock %}

{% block content %}
<h2 style="margin-bottom: 20px;">Создать новый кейс</h2>

<form method="POST" style="max-width: 800px;">
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Название кейса *</label>
        <input type="text" name="title" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Что было (описание до)</label>
        <textarea name="description_before" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
    </div>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Что сделали (описание после)</label>
        <textarea name="description_after" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
        <div>
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Тип ткани</label>
            <input type="text" name="fabric_type" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div>
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Тип наполнителя</label>
            <input type="text" name="filler_type" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
    </div>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Стоимость (₽)</label>
        <input type="number" name="price" step="0.01" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Отзыв клиента</label>
        <textarea name="client_review" rows="3" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
    </div>
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Фото</label>
        
        <!-- Загрузка файлов -->
        <div style="margin-bottom: 10px; padding: 15px; border: 2px dashed #ddd; border-radius: 4px; background: #f9f9f9;">
            <input type="file" id="photoUpload" multiple accept="image/*" style="display: none;">
            <button type="button" onclick="document.getElementById('photoUpload').click()" class="btn" style="background: #3498db; margin-bottom: 10px;">
                📷 Выбрать фото с компьютера
            </button>
            <div id="uploadStatus" style="margin-top: 10px; font-size: 14px; color: #666;"></div>
            <div id="uploadedFiles" style="margin-top: 10px;"></div>
        </div>
        
        <!-- Поле для file_id (скрыто, заполняется автоматически) -->
        <textarea name="photos" id="photosField" rows="5" placeholder="file_id1&#10;file_id2&#10;file_id3" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; margin-top: 10px;"></textarea>
        <small style="color: #666; display: block; margin-top: 5px;">
            Выберите фото выше или введите file_id из Telegram вручную (по одному на строку).
        </small>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn">Создать кейс</button>
        <a href="/admin/cases" class="btn" style="background: #95a5a6;">Отмена</a>
    </div>
</form>

<script>
const photoUpload = document.getElementById('photoUpload');
const photosField = document.getElementById('photosField');
const uploadStatus = document.getElementById('uploadStatus');
const uploadedFiles = document.getElementById('uploadedFiles');

photoUpload.addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    
    uploadStatus.innerHTML = '⏳ Загрузка фото...';
    uploadedFiles.innerHTML = '';
    
    const fileIds = [];
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        
        // Показываем имя файла
        const fileDiv = document.createElement('div');
        fileDiv.style.cssText = 'padding: 5px; margin: 5px 0; background: #fff; border-radius: 4px;';
        fileDiv.innerHTML = `📷 ${file.name} - загрузка...`;
        uploadedFiles.appendChild(fileDiv);
        
        try {
            const formData = new FormData();
            formData.append('photo', file);
            
            const response = await fetch('/admin/api/upload-photo', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success && data.file_id) {
                fileIds.push(data.file_id);
                fileDiv.innerHTML = `✅ ${file.name} - загружено (file_id: ${data.file_id.substring(0, 20)}...)`;
                fileDiv.style.color = '#27ae60';
            } else {
                fileDiv.innerHTML = `❌ ${file.name} - ошибка: ${data.error || 'Неизвестная ошибка'}`;
                fileDiv.style.color = '#e74c3c';
            }
        } catch (error) {
            fileDiv.innerHTML = `❌ ${file.name} - ошибка: ${error.message}`;
            fileDiv.style.color = '#e74c3c';
        }
    }
    
    // Обновляем поле с file_id
    const existingIds = photosField.value.split('\\n').filter(id => id.trim());
    const allIds = [...existingIds, ...fileIds].filter(id => id.trim());
    photosField.value = allIds.join('\\n');
    
    uploadStatus.innerHTML = `✅ Загружено ${fileIds.length} из ${files.length} фото`;
    uploadStatus.style.color = fileIds.length === files.length ? '#27ae60' : '#e74c3c';
    
    // Очищаем input
    photoUpload.value = '';
});
</script>
{% endblock %}
